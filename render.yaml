# Render Blueprint — Wealthy Property Portfolio Engine
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.
# Render reads this file and creates both the database and the web service.
#
# ---------------------------------------------------------------------------
# NOTHING SECRET LIVES IN THIS FILE.
#
# Every credential below is either generated by Render (generateValue) or
# entered by you in the Render dashboard when the Blueprint is applied
# (sync: false). This file is committed to a public repository, so it must
# never contain a real value.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: portfolio-property-engine
    runtime: python
    plan: free
    region: singapore
    branch: main

    # Deploy only after the GitHub Actions workflow has passed. Fall back to
    # "commit" if the Render GitHub App is not installed with Checks access,
    # otherwise no deploy will ever trigger.
    autoDeployTrigger: checksPass

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # Migrate first, then serve. Alembic's upgrade is idempotent, so this is
    # a no-op on every deploy after the first.
    #
    # `exec` hands PID 1 to uvicorn so Render's stop signal and health
    # checks reach the server directly instead of the shell.
    #
    # Two workers. Keep this number and WEALTHY_DB_POOL_SIZE in step — see
    # the connection-budget note in DEPLOYMENT.md.
    startCommand: >-
      alembic upgrade head &&
      exec uvicorn app.main:app
      --host 0.0.0.0 --port $PORT
      --workers 2
      --proxy-headers --forwarded-allow-ips="*"

    # Liveness only: it touches no dependency, so a database blip does not
    # make Render kill a healthy process. Readiness (/health/ready) is a
    # manual pre-release gate — see DEPLOYMENT.md section 7.
    healthCheckPath: /health/live

    envVars:
      # --- Database ------------------------------------------------------
      # Render hands out a plain postgresql:// URL. The application rewrites
      # the scheme to postgresql+psycopg:// at startup, because we ship
      # psycopg3 and SQLAlchemy would otherwise reach for psycopg2.
      - key: WEALTHY_DATABASE_URL
        fromDatabase:
          name: portfolio-property-db
          property: connectionString

      # --- Connection budget ---------------------------------------------
      # Max connections per worker = pool_size + max_overflow = 3.
      # Two workers therefore open at most 6 connections. Keep the sum below
      # the plan's connection limit.
      - key: WEALTHY_DB_POOL_SIZE
        value: "1"
      - key: WEALTHY_DB_MAX_OVERFLOW
        value: "2"
      - key: WEALTHY_DB_POOL_TIMEOUT
        value: "10"

      # --- Application ----------------------------------------------------
      # false disables /docs, /redoc and /openapi.json. It also enables the
      # startup guard that refuses an open token endpoint.
      - key: WEALTHY_DEBUG
        value: "false"
      - key: WEALTHY_AUTO_CREATE_TABLES
        value: "false"

      # Same-origin only. The frontend is served by this same service, so no
      # cross-origin request is ever legitimate. List explicit origins if a
      # separate client is ever added.
      - key: WEALTHY_CORS_ORIGINS
        value: "[]"

      # --- Authentication --------------------------------------------------
      # Only this email may mint a token, and only with the secret below.
      # Every other email gets 403. This is what closes the open token
      # endpoint that the development build exposes.
      - key: WEALTHY_BOOTSTRAP_ADMIN_EMAIL
        sync: false

      # Render generates a random 256-bit value. Read it back from the
      # service's Environment tab after the first deploy — you need it to
      # sign in. If the operator already has a secret, replace this entry
      # with `sync: false`.
      - key: WEALTHY_BOOTSTRAP_ADMIN_SECRET
        generateValue: true

      # --- Domain.com.au valuation provider --------------------------------
      # Leave blank to run on labelled algorithmic estimates. Real AVMs need
      # a key from https://developer.domain.com.au (looks like "key_...").
      - key: WEALTHY_DOMAIN_API_KEY
        sync: false
      - key: WEALTHY_DOMAIN_AUTH_MODE
        value: "api_key"

      # false degrades to a labelled estimate when Domain is unreachable.
      # Set true ONLY once a real key is present, because strict mode also
      # makes a missing key a startup error.
      - key: WEALTHY_STRICT_PROVIDER
        value: "false"
      - key: WEALTHY_ALLOW_ESTIMATE_FALLBACK
        value: "true"

      # --- Runtime ----------------------------------------------------------
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: portfolio-property-db
    plan: free
    region: singapore
    databaseName: portfolio
    user: portfolio

    # Render's FREE Postgres plan does NOT include managed connection
    # pooling (PgBouncer). The application compensates with a small
    # SQLAlchemy pool — see WEALTHY_DB_POOL_SIZE above.
    #
    # After upgrading to a paid plan, uncomment this line to put PgBouncer
    # in front of the database, and switch the DATABASE_URL reference to
    # `property: connectionPoolString`. Render's PgBouncer reserves 10
    # connections for direct access, so the pooled path handles the rest.
    # connectionPool: pgbouncer
